name: Platform verification
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.6.6'
      - name: Install locked source dependencies
        run: uv sync --frozen --python 3.12.9
      - name: Python regression tests
        run: uv run --frozen pytest -q --maxfail=5 --tb=short
      - name: UI regression tests
        run: node --test tests/*.cjs
      - name: Build portable runtime and plugin
        run: node dsh-plugin/scripts/prepare-runtime.mjs
      - name: Package and install in an isolated directory
        run: npm --prefix dsh-plugin run test:install
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin-${{ matrix.os }}
          path: releases/*.tgz
  assemble:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: plugin-windows-latest
          path: .cache/artifacts/windows
      - uses: actions/download-artifact@v4
        with:
          name: plugin-macos-15
          path: .cache/artifacts/macos
      - name: Assemble both validated runtimes
        run: npm --prefix dsh-plugin run assemble
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-universal
          path: releases/*.tgz
  verify-universal:
    needs: assemble
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: plugin-universal
          path: releases
      - name: Install and test the final dual-platform package
        run: npm --prefix dsh-plugin run test:install
        env:
          LUCENT_TEST_TARBALL: releases/dsh-plugin-lucentthinker-0.1.0-local.1.tgz
