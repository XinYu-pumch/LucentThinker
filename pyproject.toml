[project]
name = "lucentthinker"
version = "0.1.0"
description = "A local, DeepSeek-powered research assistant"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "httpx>=0.28,<1",
    "python-dotenv>=1,<2",
    "tiktoken>=0.9,<1",
    "json-repair>=0.40,<1",
    "tzdata>=2025.1",
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
addopts = "--basetemp=.cache/test-tmp"
